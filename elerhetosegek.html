<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elérhetőségek</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }


        .card {
            background-color: #1e1e1e;
            border: 1px solid #ff6666;
            border-radius: 12px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            display: flex;
            gap: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }


        .info,
        .urlap {
            flex: 1;
        }


        h1 {
            color: #ff3333;
            margin-top: 0;
        }


        a {
            color: #ff6666;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }


        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-family: inherit;
        }

        input[type="checkbox"] {
            margin-right: 5px;
        }


        button {
            width: 100%;
            background-color: #ff3333;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1;
            margin-top: 15px;
        }

        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>

<body>

    <main>
        <section class="card">

            <div class="info">
                <h1>Lépj velem kapcsolatba!</h1>
                <p>
                    Akár kreatív együttműködésről van szó, akár G.A.L.A.M.B. észlelést szeretnél bejelenteni, írj
                    bátran!
                </p>

                <div class="link" style="font-size: medium;">
                    <p><a href="https://mail.google.com/mail/?view=cm&fs=1&to=david.melanie2004@gmail.com"
                            target="_blank">Gmail</a></p>
                    <p><a href="https://www.instagram.com/melaniedavjd/" target="_blank">Instagram</a></p>
                    <p><a href="https://www.facebook.com/maviidela?locale=hu_HU" target="_blank">Facebook</a></p>
                    <br><br>
                    <p style="font-size: small;"><a href="index.html">Vissza a főoldalra</a>
                        <br><a href="bemutatkozas.html">Az ember az oldal mögött...</a>
                        <br><a href="portfolio.html">Portfólió</a>
                    </p>
                </div>
            </div>


            <div class="urlap">
                <form>
                    <label for="nev">Teljes neved:</label>
                    <input type="text" id="nev" name="nev" placeholder="Pl. Nemegy G. Alamb">

                    <label for="ok">Megkeresés oka:</label>
                    <select name="ok" id="ok">
                        <option value="coop">Együttműködés</option>
                        <option value="galamb">G.A.L.A.M.B. észlelés</option>
                        <option value="pick" selected>Válassz egy opciót!</option>
                        <option value="egyeb">Egyéb</option>
                    </select>

                    <label for="text">Üzenet:</label>
                    <textarea name="text" id="text" placeholder="Írd le a részleteket..." rows="4"></textarea>

                    <div>
                        <input type="checkbox" name="accept" id="accept">
                        <label for="accept" style="font-size: small">Az adatkezelést és az 5 méteres galambmentes zóna
                            igazolását elfogadom.</label>
                    </div>

                    <button type="submit">Titkosított üzenet küldése</button>
                </form>
            </div>


        </section>
    </main>

</body>

</html>
